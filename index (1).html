<html lang="ru"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8e7e3;--card:#f6f5f2;--ink:#1c1b1a;--mut:#6b6a66;--line:#d2d0ca;--acc:#34457f;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121315;--card:#1b1c1f;--ink:#ecebe7;--mut:#9a9893;--line:#303236;--acc:#9db0ff;--on:#101218}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121315;--card:#1b1c1f;--ink:#ecebe7;--mut:#9a9893;--line:#303236;--acc:#9db0ff;--on:#101218}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Manrope,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;gap:16px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;padding:18px 20px 10px;max-width:1100px;margin:auto}
h1{font:600 28px/1 'Cormorant Garamond',serif;margin:0}
nav{display:flex;gap:4px}
nav button{border:0;background:none;padding:8px 14px;border-radius:99px;cursor:pointer;color:var(--mut);font-weight:600}
nav button.on{background:var(--ink);color:var(--bg)}
main{max-width:1100px;margin:auto;padding:10px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.form{display:grid;gap:14px;max-width:640px}
label{display:grid;gap:5px;font-weight:600;font-size:13px}
label span{font-weight:400;color:var(--mut)}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:130px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.err{color:#c0392b;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{background:none;border:0;padding:0;text-align:left;cursor:pointer}
.tile b{display:block;margin-top:7px;font:600 17px/1.15 'Cormorant Garamond',serif}
.tile small{color:var(--mut)}
.split{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:26px;align-items:start}
@media(max-width:760px){.split{grid-template-columns:1fr}}
.why li{margin:0 0 8px}
.files{font-family:ui-monospace,monospace;font-size:13px;color:var(--mut);padding-left:18px}
table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
h2{font:600 24px/1.1 'Cormorant Garamond',serif;margin:0 0 10px}
.muted{color:var(--mut)}
/* ---- scene ---- */
.scene{container-type:inline-size;position:relative;aspect-ratio:9/16;overflow:hidden;border-radius:12px;background:var(--s1);color:var(--si);isolation:isolate}
.ph{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.8s}
.ph.on{opacity:1;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translate(-2%,-1%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes gr{0%{background-position:0 0}25%{background-position:-40px 20px}50%{background-position:30px -30px}75%{background-position:-20px -50px}100%{background-position:0 0}}
.t-monet .ph{filter:url(#paint) saturate(1.3) brightness(1.05)}
.t-film .ph{filter:sepia(.35) contrast(1.1) saturate(.9)}
.t-kandinsky .ph{filter:grayscale(1) contrast(1.35)}
.duo{position:absolute;inset:0;background:var(--sa);mix-blend-mode:multiply;opacity:.8}
.t-minimal .ph{inset:11% 13% 38% 13%;filter:grayscale(.5) brightness(1.08);animation:none}
.t-minimal .ph.on{animation:none}
.t-collage .ph{border:2cqw solid #fff;box-shadow:0 1cqw 3cqw #0005;animation:none!important}
.wash{position:absolute;inset:0;background:radial-gradient(circle at 30% 25%,var(--sa),transparent 55%),radial-gradient(circle at 75% 80%,var(--s2),transparent 60%);mix-blend-mode:soft-light;opacity:.85}
.dot{position:absolute;width:15cqw;height:15cqw;border-radius:50%;background:var(--sa);right:14cqw;top:6%}
.kand{position:absolute;inset:0;width:100%;height:100%}
.kg{transform-box:fill-box;transform-origin:center;animation:spin var(--sp) linear infinite}
.grain{position:absolute;inset:-60px;opacity:var(--g);mix-blend-mode:overlay;animation:gr .9s steps(4) infinite;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,#0006)}
.scrim{position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(transparent,var(--s1) 78%)}
.t-minimal .scrim,.t-collage .scrim{height:40%}
.dt{position:absolute;left:6cqw;top:5cqw;font:600 3.4cqw Manrope;letter-spacing:.06em;color:var(--si);background:color-mix(in srgb,var(--s1) 70%,transparent);padding:1cqw 2.4cqw;border-radius:99px}
.ttl{position:absolute;left:6cqw;right:6cqw;bottom:16cqw;font:600 9.2cqw/1 'Cormorant Garamond',serif}
.sig{position:absolute;left:6cqw;right:6cqw;bottom:5cqw;font:500 5.6cqw/1.1 Caveat,cursive;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(prefers-reduced-motion:reduce){.ph.on,.kg,.grain{animation:none}}
.auth{margin:40px auto}.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{position:relative;width:64px;height:80px;border-radius:8px;background-size:cover;background-position:center}.thumbs button{position:absolute;top:3px;right:3px;border:0;border-radius:99px;width:22px;height:22px;cursor:pointer;background:var(--ink);color:var(--bg)}.badge{font-size:12px;color:var(--mut)}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn.danger{background:#b3372b;color:#fff}.bar>*{max-width:100%}
.map{position:relative;height:calc(100vh - 130px);min-height:520px;border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--card);background-image:radial-gradient(var(--line) 1.4px,transparent 1.6px)}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.circ{position:absolute;border-radius:50%;border:2px dashed var(--cc);background:color-mix(in srgb,var(--cc) 13%,transparent)}
.clab{position:absolute;left:50%;top:-42px;transform:translateX(-50%);white-space:nowrap;font:600 26px/1 'Cormorant Garamond',serif;cursor:grab;display:flex;gap:8px;align-items:center;padding:5px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--cc);touch-action:none}
.clab input{font:inherit;width:210px;background:none;border:0;border-bottom:1px solid var(--ink);color:inherit}
.clab small{font:600 12px Manrope;color:var(--mut)}
.clab button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px;padding:0 2px}
.mc{position:absolute;width:84px;cursor:grab;touch-action:none}
.mc .scene{box-shadow:0 4px 14px #0004;border-radius:8px;transition:transform .15s,box-shadow .15s}
.mc.dr{z-index:50;cursor:grabbing}
.mc.dr .scene{transform:scale(1.1);box-shadow:0 14px 32px #0006}
.mc span{display:block;margin:4px -14px 0;font:600 11px/1.2 Manrope;text-align:center;color:var(--ink)}
.mtool{position:absolute;left:12px;top:12px;z-index:60;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px);align-items:center}
.mtool .btn{padding:8px 12px;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.mtool .btn.pri{background:var(--acc);color:var(--on);border-color:var(--acc)}
.mhint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--mut);pointer-events:none}
.mempty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}.mempty>div{pointer-events:auto}
.story{font:italic 500 23px/1.5 'Cormorant Garamond',serif;margin:0 0 16px;padding-left:16px;border-left:3px solid var(--acc);white-space:pre-wrap}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="paint"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="22"/></filter></svg>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const {useState,useEffect,useMemo,useRef}=React;
const html=htm.bind(React.createElement);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hash=str=>{let h=7;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};

/* ---------- словари для разбора текста ---------- */
const LEX={calm:['спокой','тепл','уют','какао','чай','тих','медленн','гуля','закат','камин','книг','пруд'],energy:['бег','танц','быстр','вечеринк','друз','смех','концерт','ярк','драйв','крич','прыг'],tense:['срочн','дедлайн','сдач','нерв','стресс','проект','экзамен','офис','успе','тревог'],sad:['груст','одинок','дожд','скуч','тоск','плак','потер','туман','пусто'],joy:['счаст','радост','солнц','море','улыб','любл','любим','влюб','смеял','отпуск']};
const SEAS=[['autumn',['Осенний','Осеннее'],/осен|лист|октябр|ноябр/],['winter',['Зимний','Зимнее'],/зим|снег|мороз|декабр/],['spring',['Весенний','Весеннее'],/весн|подснеж|апрел|капел/],['summer',['Летний','Летнее'],/лето|летн|жар|пляж|море|июл/]];
const TIMES=[['Ночь',/ноч|полночь/],['Утро',/утр|рассвет|завтрак/],['День',/днём|днем|полдень|обед/],['Вечер',/вечер|закат|сумерк/]];
const PLACES=[[/парк/,'парк','в парке',0],[/мор[еяю]|пляж/,'море','у моря',1],[/офис/,'офис','в офисе',0],[/пруд|озер/,'пруд','у пруда',0],[/кафе|кофейн/,'кафе','в кафе',1],[/лес/,'лес','в лесу',0],[/город|улиц/,'город','в городе',0],[/дом|квартир/,'дом','дома',0]];
const DET=[[/какао/,'и какао'],[/сдач|дедлайн/,'перед сдачей'],[/друз/,'с друзьями'],[/девушк|любим|жен[аы]/,'вдвоём'],[/дожд/,'под дождём']];
const PAD={calm:'без спешки',tense:'на пределе',sad:'в тишине',joy:'в лучах света',energy:'на всех скоростях'};
const MOODH={calm:28,joy:45,energy:8,tense:215,sad:228};
const GENRES={'джаз / классика':[78,.3,0],'поп':[118,.7,0],'электроника':[130,.85,1],'рок':[125,.8,1],'инди / фолк':[95,.4,0],'ambient':[62,.15,1],'хип-хоп':[92,.7,1]};
const TECH={
 monet:{name:'Клод Моне: мазки и свет',why:'тихий день с тёплым настроением: фото «расплываются» акварельным смещением, поверх мягкий цветной свет, много воздуха'},
 kandinsky:{name:'Кандинский: геометрия напряжения',why:'высокая собранность и энергия: фото в двух тонах, поверх вращающиеся линии, круги и треугольники'},
 minimal:{name:'Японский минимализм: ма (пустота)',why:'тихий и грустный день: один кадр в маленькой рамке, много пустого места и один акцентный круг'},
 collage:{name:'Коллаж и поляроиды',why:'яркий насыщенный день: несколько кадров лежат одновременно с наклоном, как снимки на столе'},
 film:{name:'Плёночная фотография',why:'ровный день без выраженного полюса: зерно, выцветшая тёплая обработка и виньетка'}};

/* ---------- анализ фото ---------- */
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2,d=M-m;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}return{h,s,l}}
function prep(src,max=900){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);let st={h:30,s:.3,l:.5,warm:0};try{const t=document.createElement('canvas');t.width=t.height=24;const y=t.getContext('2d');y.drawImage(im,0,0,24,24);const p=y.getImageData(0,0,24,24).data;let r=0,g=0,b=0;for(let i=0;i<p.length;i+=4){r+=p[i];g+=p[i+1];b+=p[i+2]}const n=p.length/4;r/=n;g/=n;b/=n;st={...rgb2hsl(r,g,b),warm:(r-b)/255}}catch(e){}ok({url:c.toDataURL('image/jpeg',.72),...st})};im.onerror=no;im.src=src})}
async function audioEnergy(file){const ctx=new (window.AudioContext||window.webkitAudioContext)();const buf=await ctx.decodeAudioData(await file.arrayBuffer());const d=buf.getChannelData(0);let s=0,n=0;for(let i=0;i<d.length;i+=50){s+=d[i]*d[i];n++}ctx.close();return clamp(Math.sqrt(s/n)*3.2)}

/* ---------- ядро: ввод -> стиль ---------- */
function makeDay({id,date,text,photos:ph0,song,customTitle}){
 const photos=ph0.map(p=>({h:30,s:.3,l:.5,warm:0,...p}));
 const low=text.toLowerCase(),cnt=k=>clamp(LEX[k].reduce((n,w)=>n+low.split(w).length-1,0)/2);
 const sc={};Object.keys(LEX).forEach(k=>sc[k]=cnt(k));
 const ph=photos.reduce((a,p)=>({s:a.s+p.s/photos.length,l:a.l+p.l/photos.length,w:a.w+p.warm/photos.length,x:a.x+Math.cos(p.h*Math.PI/180),y:a.y+Math.sin(p.h*Math.PI/180)}),{s:0,l:0,w:0,x:0,y:0});
 const pH=(Math.atan2(ph.y,ph.x)*180/Math.PI+360)%360,tN=clamp((song.bpm-60)/100),maj=song.mode==='major';
 const aro=clamp(.35+.3*sc.energy+.2*sc.tense-.25*sc.calm+.35*(song.energy-.5)+.3*(tN-.4));
 const val=clamp(.5+.3*sc.joy+.15*sc.calm-.3*sc.sad-.15*sc.tense+(maj?.12:-.12)+.1*ph.w+.1*(ph.l-.5));
 const top=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
 const dom=top[1]>0?top[0]:(aro>.55?'energy':'calm');
 const tech=sc.tense>.4&&aro>.45?'kandinsky':val<.4&&aro<.5?'minimal':aro>.62&&val>.5?'collage':aro<.55&&val>=.45?'monet':'film';
 const season=SEAS.find(s=>s[2].test(low)),time=(TIMES.find(t=>t[1].test(low))||['День'])[0],place=PLACES.find(p=>p[0].test(low)),det=(DET.find(d=>d[0].test(low))||[])[1];
 let w=season&&place?[season[1][place[3]],place[1],det]:[time,place&&place[2],det];
 let words=w.filter(Boolean).join(' ').split(' ');if(words.length<3)words=words.concat(PAD[dom].split(' '));
 const title=words.slice(0,7).join(' ').replace(/^./,c=>c.toUpperCase());
 const mh=MOODH[dom],wp=ph.s>.08?.55:.15,h=(Math.atan2(wp*Math.sin(pH*Math.PI/180)+(1-wp)*Math.sin(mh*Math.PI/180),wp*Math.cos(pH*Math.PI/180)+(1-wp)*Math.cos(mh*Math.PI/180))*180/Math.PI+360)%360;
 const dark=sc.tense>.4||sc.sad>.4||time==='Ночь',S=28+40*aro+15*val,L=dark?11:tech==='minimal'?93:84;
 const hs=(a,b,c)=>`hsl(${Math.round(a)} ${Math.round(b)}% ${Math.round(c)}%)`;
 const grain=tech==='film'?.45:tech==='minimal'?.08:.15+.15*aro,sec=clamp(7.5-4.5*aro,3,7.5);
 const vd=aro<.4&&val>.45?'тихий и тёплый':aro>.6?'живой и быстрый':val<.4?'низкий и медленный':'ровный';
 const found=Object.entries(sc).filter(e=>e[1]>0).map(e=>({calm:'спокойствие',energy:'движение',tense:'напряжение',sad:'грусть',joy:'радость'}[e[0]])+'').join(', ');
 const style={tech,s1:hs(h,S*.5,L),s2:hs(h+30,S*.6,L+(dark?8:-8)),sa:hs(h+(tech==='kandinsky'?150:20),clamp(S+15,40,90),dark?62:48),si:hs(h,20,dark?92:15),grain,sec,kspeed:Math.round(40-25*aro),aro,val,dark,
  voice:{rate:.82+.3*aro,pitch:.95+.2*val,desc:vd},
  why:[`Текст: найдено — ${found||'нейтральная лексика'}; время суток — ${time.toLowerCase()}${season?', сезон — '+season[0]:''}.`,
  `Фото: средний оттенок ${Math.round(pH)}°, светлота ${Math.round(ph.l*100)}%, ${ph.w>0?'тёплая':'холодная'} гамма — тянет палитру к своему цвету (вес ${Math.round(wp*100)}%), остальное задаёт настроение.`,
  `Песня: ${song.bpm} BPM, ${maj?'мажор':'минор'}, энергия ${Math.round(song.energy*100)}% — кадры меняются каждые ${sec.toFixed(1)} с, зерно ${Math.round(grain*100)}%.`,
  `Приём «${TECH[tech].name}»: ${TECH[tech].why}.`,
  `Итог: возбуждение ${Math.round(aro*100)}%, приятность ${Math.round(val*100)}%. Это оценка алгоритма по словам и звуку, а не диагноз.`,
  `Озвучка: голос ${vd}, скорость ${(.82+.3*aro).toFixed(2)}, высота ${(.95+.2*val).toFixed(2)}; предложения читаются по одному, с паузами.`]};
 return{id:id||(crypto.randomUUID?crypto.randomUUID():'d'+Date.now()+Math.random().toString(36).slice(2)),date,text,photos:photos.map(({url,h,s,l,warm})=>({url,h,s,l,warm})),song,title:customTitle||title,manualTitle:!!customTitle,style};
}

/* ---------- демо-дни ---------- */
const demoSvg=(c,s)=>{const r=rng(s);let o='';for(let i=0;i<9;i++)o+=`<circle cx="${r()*400}" cy="${r()*500}" r="${20+r()*90}" fill="${c[2]}" opacity="${.08+r()*.25}"/>`;return'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><rect width="400" height="500" fill="url(#g)"/>${o}</svg>`)};

 const base=(d,list)=>{if(d.pos)return d.pos;const c=list.find(c=>c.id===catOf(d)),r=rng(hash(d.id));if(c){const a=r()*6.283,m=Math.sqrt(r())*c.r*.6;return{x:c.x+Math.cos(a)*m,y:c.y+Math.sin(a)*m}}return{x:-330+r()*660,y:700+r()*100}};
 const show=d=>{const p=base(d,cs),mv=drag&&((drag.type==='card'&&drag.id===d.id)||(drag.type==='cat'&&d.pos&&catOf(d)===drag.id));return mv?{x:p.x+dx,y:p.y+dy}:p};
 const finish=(type,id,ax,ay)=>{
  if(type==='card'){const d=days.find(x=>x.id===id),p=base(d,cats),np={x:p.x+ax,y:p.y+ay};let best=null,bd=1e9;cats.forEach(c=>{const m=Math.hypot(np.x-c.x,np.y-c.y);if(m<c.r&&m<bd){best=c;bd=m}});onMove([{...d,pos:{x:Math.round(np.x),y:Math.round(np.y)},cat:best?best.id:null}])}
  else{onCats(cats.map(x=>x.id===id?{...x,x:Math.round(x.x+ax),y:Math.round(x.y+ay)}:x));const mv=days.filter(d=>d.pos&&catOf(d)===id).map(d=>({...d,pos:{x:Math.round(d.pos.x+ax),y:Math.round(d.pos.y+ay)}}));if(mv.length)onMove(mv)}};
 const begin=(e,type,id)=>{e.stopPropagation();const sx=e.clientX,sy=e.clientY,k=v.k;let moved=false;
  const mv=ev=>{const ax=(ev.clientX-sx)/k,ay=(ev.clientY-sy)/k;if(Math.abs(ax*k)+Math.abs(ay*k)>5)moved=true;setDrag({type,id,dx:ax,dy:ay})};
  const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);setDrag(null);if(!moved){if(type==='card')onOpen(id);return}finish(type,id,(ev.clientX-sx)/k,(ev.clientY-sy)/k)};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)};
 const pan=e=>{const sx=e.clientX,sy=e.clientY,o=v,mv=ev=>setV({...o,x:o.x+ev.clientX-sx,y:o.y+ev.clientY-sy}),up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)};
 const addCat=()=>{const n=name.trim();if(!n)return;const r=box.current.getBoundingClientRect();onCats([...cats,{id:'c'+Date.now(),name:n,x:Math.round((r.width/2-v.x)/v.k),y:Math.round((r.height/2-v.y)/v.k),r:170,color:`hsl(${hash(n)%360} 55% 55%)`}]);setName('');setAdd(false)};
 const delCat=c=>{const mv=days.filter(d=>catOf(d)===c.id).map(d=>({...d,pos:base(d,cats),cat:null}));if(mv.length)onMove(mv);onCats(cats.filter(x=>x.id!==c.id))};
 const rename=()=>{if(ed&&ed.value.trim())onCats(cats.map(c=>c.id===ed.id?{...c,name:ed.value.trim()}:c));setEd(null)};
 const stop=e=>e.stopPropagation();
 return html`<div class="map" ref=${box} onPointerDown=${pan} style=${{backgroundPosition:`${v.x}px ${v.y}px`,backgroundSize:`${28*v.k}px ${28*v.k}px`}}>
  <div class="world" style=${{transform:`translate(${v.x}px,${v.y}px) scale(${v.k})`}}>
   ${cs.map(c=>html`<div key=${c.id} class="circ" style=${{left:c.x-c.r,top:c.y-c.r,width:c.r*2,height:c.r*2,'--cc':c.color}}>
    <div class="clab" onPointerDown=${e=>begin(e,'cat',c.id)} onDoubleClick=${()=>setEd({id:c.id,value:c.name})} title="Тяните, чтобы переместить круг. Двойной клик переименует.">
     ${ed&&ed.id===c.id?html`<input autoFocus=${true} value=${ed.value} onPointerDown=${stop} onChange=${e=>setEd({...ed,value:e.target.value})} onBlur=${rename} onKeyDown=${e=>e.key==='Enter'&&rename()}/>`:html`<span>${c.name}</span>`}
     <small>${days.filter(d=>catOf(d)===c.id).length}</small>
     <button aria-label="Удалить категорию" onPointerDown=${stop} onClick=${()=>delCat(c)}>×</button></div></div>`)}
   ${days.map(d=>{const p=show(d),on=drag&&drag.type==='card'&&drag.id===d.id;return html`<div key=${d.id} class=${'mc'+(on?' dr':'')} style=${{left:p.x-42,top:p.y-75}} onPointerDown=${e=>begin(e,'card',d.id)}><${Scene} d=${d} live=${false}/><span>${d.title}</span></div>`})}
  </div>
  <div class="mtool" onPointerDown=${stop}>
   ${add?html`<input type="text" autoFocus=${true} placeholder="Название категории" value=${name} onChange=${e=>setName(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&addCat()} style=${{width:180}}/><button class="btn pri" onClick=${addCat}>Создать</button><button class="btn" onClick=${()=>setAdd(false)}>Отмена</button>`
    :html`<button class="btn pri" onClick=${()=>setAdd(true)}>+ Категория</button><button class="btn" onClick=${onSort} title="Вернуть карточки в круги по настроению дня">Разложить по настроению</button>`}
   <button class="btn" aria-label="Приблизить" onClick=${()=>zoomC(1.25)}>+</button><button class="btn" aria-label="Отдалить" onClick=${()=>zoomC(.8)}>−</button></div>
  ${!days.length&&html`<div class="mempty"><div onPointerDown=${stop}><p>Пока нет воспоминаний.</p><button class="btn" onClick=${onSeed}>Добавить 4 демо-дня</button></div></div>`}
  <div class="mhint">Тяните карточки между кругами, клик открывает воспоминание. Колесо мыши меняет масштаб.</div></div>`}

function System(){return html`<div style=${{display:'grid',gap:18,maxWidth:820}}>
 <div class="card"><h2>Идея</h2><p>Фотографии хранят, как выглядел день, но не как он ощущался. Дневник собирает из текста, фото и песни воспоминание, в котором настроение дня выражено формой, цветом и ритмом, и складывает всё в папку дня. Папки лежат на карте воспоминаний: круги-категории можно создавать, переименовывать и двигать, а карточки переносятся между ними.</p></div>
 <div class="card"><h2>Единый язык</h2><p><b>Постоянно:</b> вертикальный кадр 9:16, дата сверху слева, название серифом (3–7 слов), рукописная подпись из первой фразы записи, фото всегда на всю рамку или в рамке по правилам приёма.</p><p><b>Меняется:</b> палитра (оттенок из смеси цвета фото и настроения), приём обработки, зерно, ритм смены кадров, скорость анимации, голос озвучки.</p></div>
 <div class="card"><h2>Художественные приёмы</h2><table><tbody>${Object.entries(TECH).map(([k,t])=>html`<tr key=${k}><th>${t.name}</th><td>${t.why}</td></tr>`)}</tbody></table></div>
 <div class="card"><h2>Как музыка влияет на результат</h2><p>Темп задаёт ритм смены кадров и скорость вращения форм. Энергия повышает возбуждение, а значит зерно и контраст. Мажор или минор сдвигает приятность: холодные, тихие дни уходят в минимализм, тёплые и медленные в Моне. Для загруженного файла энергия считается по громкости сигнала.</p></div>
 <div class="card"><h2>Использованные инструменты и честные ограничения</h2><p>React 18, htm, Canvas API, Web Audio API, Web Speech API, SVG-фильтры, Google Fonts. Разбор текста сделан по словарю основ слов, без внешних моделей. Песни по ссылке играют во встроенном плеере сервиса (YouTube, Spotify, Яндекс Музыка, SoundCloud), сами песни не хранятся. Аккаунты и дни хранятся в Supabase (без ключей: только в этом браузере). Озвучка использует голоса браузера, лучшие из них Natural или Online. Предположения об эмоциях не являются диагнозом.</p></div></div>`}

function App(){
 const[user,setUser]=useState(undefined),[tab,setTab]=useState('map'),[days,setDays]=useState([]),[cats,setCats]=useState([]),[open,setOpen]=useState(null),[note,setNote]=useState('');
 useEffect(()=>{auth.session().then(setUser,()=>setUser(null))},[]);
 useEffect(()=>{if(!user){setDays([]);setCats([]);return}store.list(user.id).then(rows=>{const m=rows.find(r=>r.id==='meta:cats'),a=rows.filter(r=>!String(r.id).startsWith('meta:'));setDays(a);if(m&&m.cats)setCats(m.cats);else{setCats(DEFCATS);store.save(user.id,{id:'meta:cats',cats:DEFCATS}).catch(()=>{})}setTab(a.length?'map':'new')}).catch(e=>setNote('Не удалось загрузить дни: '+e.message))},[user]);
 const fail=e=>setNote('Не удалось сохранить: '+(e.message||'ошибка')+'. Если фото слишком много, удалите ненужные дни.');
 const save=d=>{setNote('');setDays(x=>x.some(y=>y.id===d.id)?x.map(y=>y.id===d.id?d:y):[...x,d]);store.save(user.id,d).catch(fail)};
 const saveMany=a=>a.forEach(save);
 const saveCats=c=>{setCats(c);store.save(user.id,{id:'meta:cats',cats:c}).catch(fail)};
 const del=id=>{setDays(x=>x.filter(y=>y.id!==id));setOpen(null);store.remove(user.id,id).catch(fail)};
 const demo=async()=>{(await seed()).forEach(save)};
 const sort=()=>saveMany(days.map(({cat,pos,...r})=>r));
 if(user===undefined)return html`<main><p class="muted">Загрузка…</p></main>`;
 if(!user)return html`<div><header><h1>Лента дней</h1></header><main><${Auth} onUser=${setUser}/></main></div>`;
 const cur=days.find(d=>d.id===open),go=t=>{setTab(t);setOpen(null)};
 return html`<div><header><h1>Лента дней</h1><nav>${[['map','Карта'],['new','Записать день'],['sys','Как это устроено']].map(([k,l])=>html`<button key=${k} class=${tab===k&&!cur?'on':''} onClick=${()=>go(k)}>${l}</button>`)}<button onClick=${async()=>{await auth.signOut();setUser(null)}} title=${user.email}>Выйти</button></nav></header>
 <main>${note&&html`<p class="err" role="alert">${note}</p>`}${cur?html`<${Folder} d=${cur} onBack=${()=>setOpen(null)} onSave=${save} onDelete=${del}/>`
  :tab==='new'?html`<${NewDay} onSave=${d=>{save(d);setTab('map');setOpen(d.id)}}/>`
  :tab==='map'?html`<${MemoryMap} days=${days} cats=${cats} onOpen=${setOpen} onMove=${saveMany} onCats=${saveCats} onSort=${sort} onSeed=${demo}/>`:html`<${System}/>`}</main></div>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
