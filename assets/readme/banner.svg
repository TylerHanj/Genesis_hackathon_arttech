<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="Лента дней — дневник атмосферы">
  <title>Лента дней — дневник атмосферы</title>
  <defs>
    <radialGradient id="glowA" cx="20%" cy="16%" r="62%"><stop offset="0" stop-color="#C0CC82" stop-opacity=".30"/><stop offset="1" stop-color="#C0CC82" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="86%" cy="92%" r="58%"><stop offset="0" stop-color="#A7A9B8" stop-opacity=".24"/><stop offset="1" stop-color="#A7A9B8" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#75737E" fill-opacity=".5"/></pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="drop" x="-40%" y="-30%" width="180%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
    <linearGradient id="mon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3D89C"/><stop offset="1" stop-color="#C98B5B"/></linearGradient>
    <linearGradient id="monFade" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#F6ECD9" stop-opacity="0"/><stop offset=".85" stop-color="#F6ECD9" stop-opacity=".95"/></linearGradient>
    <linearGradient id="duo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B4660"/><stop offset="1" stop-color="#C0CC82"/></linearGradient>
    <linearGradient id="mood" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#5E5D6B"/><stop offset="1" stop-color="#7C8253"/></linearGradient>
    <clipPath id="frame"><rect width="150" height="266" rx="14"/></clipPath>
  </defs>

  <rect width="1280" height="460" rx="28" fill="#2F2A2E"/>
  <rect width="1280" height="460" rx="28" fill="url(#dots)"/>
  <rect width="1280" height="460" rx="28" fill="url(#glowA)"/>
  <rect width="1280" height="460" rx="28" fill="url(#glowB)"/>

  <!-- заголовок -->
  <text x="78" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#D7D8DF">Лента дней</text>
  <text x="82" y="232" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#A7A9B8">дневник атмосферы</text>
  <text x="82" y="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#C0CC82">текст · фото · песня  →  цвет, ритм и свет дня</text>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#D7D8DF">
    <rect x="82" y="336" width="104" height="32" rx="16" fill="#453F43" stroke="#75737E" stroke-opacity=".6"/><text x="134" y="357" text-anchor="middle">қазақша</text>
    <rect x="196" y="336" width="100" height="32" rx="16" fill="#453F43" stroke="#75737E" stroke-opacity=".6"/><text x="246" y="357" text-anchor="middle">русский</text>
    <rect x="306" y="336" width="96" height="32" rx="16" fill="#453F43" stroke="#75737E" stroke-opacity=".6"/><text x="354" y="357" text-anchor="middle">English</text>
    <rect x="412" y="336" width="196" height="32" rx="16" fill="#453F43" stroke="#75737E" stroke-opacity=".6"/><text x="510" y="357" text-anchor="middle">компьютер и телефон</text>
  </g>

  <!-- круги карты -->
  <circle cx="862" cy="250" r="150" fill="none" stroke="#C0CC82" stroke-opacity=".4" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="1150" cy="128" r="96" fill="none" stroke="#A7A9B8" stroke-opacity=".45" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="1010" cy="392" r="78" fill="none" stroke="#75737E" stroke-opacity=".7" stroke-width="2" stroke-dasharray="7 7"/>

  <!-- кадр «Моне» -->
  <g transform="translate(770 104) rotate(-7)" filter="url(#drop)">
    <g clip-path="url(#frame)">
      <rect width="150" height="266" fill="url(#mon)"/>
      <g filter="url(#soft)">
        <circle cx="40" cy="60" r="34" fill="#FFF6D8" fill-opacity=".7"/><circle cx="110" cy="96" r="40" fill="#F7C873" fill-opacity=".7"/>
        <circle cx="58" cy="150" r="36" fill="#E9A27E" fill-opacity=".65"/><circle cx="118" cy="182" r="30" fill="#FFF1C9" fill-opacity=".6"/>
      </g>
      <rect width="150" height="266" fill="url(#monFade)"/>
      <rect x="10" y="10" width="62" height="16" rx="8" fill="#F6ECD9" fill-opacity=".75"/>
      <text x="14" y="240" font-family="Georgia, serif" font-size="14" fill="#3A2A20">Осенний парк</text>
      <rect x="14" y="249" width="96" height="3" rx="1.5" fill="#3A2A20" fill-opacity=".35"/>
    </g>
  </g>

  <!-- кадр «Кандинский» -->
  <g transform="translate(930 64)" filter="url(#drop)">
    <g clip-path="url(#frame)">
      <rect width="150" height="266" fill="#221E22"/>
      <rect x="18" y="34" width="114" height="150" fill="url(#duo)" fill-opacity=".55"/>
      <g stroke-linecap="round">
        <line x1="-10" y1="210" x2="170" y2="40" stroke="#A7A9B8" stroke-width="2"/>
        <line x1="10" y1="20" x2="150" y2="230" stroke="#C0CC82" stroke-width="1.5"/>
        <line x1="0" y1="120" x2="160" y2="104" stroke="#D9785B" stroke-width="3"/>
      </g>
      <circle cx="102" cy="74" r="26" fill="#C0CC82"/>
      <circle cx="44" cy="150" r="18" fill="none" stroke="#D9785B" stroke-width="4"/>
      <polygon points="88,150 130,210 52,206" fill="#D9785B" fill-opacity=".85"/>
      <circle cx="30" cy="60" r="6" fill="#A7A9B8"/>
      <text x="12" y="244" font-family="Georgia, serif" font-size="14" fill="#E8E6EC">Ночь перед сдачей</text>
    </g>
  </g>

  <!-- кадр «минимализм» -->
  <g transform="translate(1088 124) rotate(6)" filter="url(#drop)">
    <g clip-path="url(#frame)">
      <rect width="150" height="266" fill="#ECEDF0"/>
      <rect x="44" y="64" width="62" height="80" fill="#FFFFFF"/>
      <rect x="48" y="68" width="54" height="72" fill="#8D93A6"/>
      <circle cx="108" cy="176" r="11" fill="#B86A5C"/>
      <text x="14" y="240" font-family="Georgia, serif" font-size="14" fill="#2F2A2E">День в тишине</text>
    </g>
  </g>

  <!-- карта настроения -->
  <g transform="translate(1144 300)" filter="url(#drop)">
    <rect width="108" height="108" rx="16" fill="url(#mood)" stroke="#75737E"/>
    <line x1="54" y1="8" x2="54" y2="100" stroke="#D7D8DF" stroke-opacity=".25"/>
    <line x1="8" y1="54" x2="100" y2="54" stroke="#D7D8DF" stroke-opacity=".25"/>
    <g fill="none" stroke="#D7D8DF" stroke-opacity=".8" stroke-width="1.5" stroke-linecap="round">
      <circle cx="90" cy="18" r="8"/><path d="M86 20 q4 4 8 0"/><circle cx="18" cy="90" r="8"/><path d="M14 94 q4 -4 8 0"/>
    </g>
    <g fill="#D7D8DF"><circle cx="87" cy="16" r="1"/><circle cx="93" cy="16" r="1"/><circle cx="15" cy="88" r="1"/><circle cx="21" cy="88" r="1"/></g>
    <circle cx="76" cy="34" r="9" fill="#C0CC82" stroke="#2F2A2E" stroke-width="3"/>
  </g>
</svg>
